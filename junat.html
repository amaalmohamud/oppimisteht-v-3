<main style="padding-left:16px">

    <h1>Junat</h1>
    <p>Haetaan junien aikataulut VR:n avoimesta datasta.</p>

    <div id="vastaus"></div>

</main>

<script>
fetch("https://rata.digitraffic.fi/api/v1/live-trains/station/HKI?departing_trains=10&include_nonstopping=false")
.then(function(response) {
    return response.json();
})
.then(function(data) {

    let teksti = "";

    for (let i = 0; i < data.length; i++) {

        for (let j = 0; j < data[i].timeTableRows.length; j++) {

            if (data[i].timeTableRows[j].stationShortCode == "TPE"
                && data[i].timeTableRows[j].type == "ARRIVAL") {

                teksti += "<h3>Juna " + data[i].trainType + " " + data[i].trainNumber + "</h3>";

                let pvm = data[i].timeTableRows[j].scheduledTime;
                let aika = pvm.substr(0,10) + " klo " + pvm.substr(11,5);

                teksti += "<p>Aika: " + aika + "</p>";
                teksti += "<hr>";
            }
        }
    }

    document.getElementById("vastaus").innerHTML = teksti;
});
</script>

</body>
</html>

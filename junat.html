<main style="padding-left:16px">

    <h1>Junat</h1>
    <p>Haetaan junien aikataulut VR:n avoimesta datasta.</p>

    <div id="vastaus"></div>

</main>

<script>
fetch("https://rata.digitraffic.fi/api/v1/live-trains")
.then(function(response) {
    return response.json();
})
.then(function(data) {

    let teksti = "";

    // näytetään 5 ensimmäistä junaa
    for (let i = 0; i < 5; i++) {

        teksti += "<h3>Juna " + data[i].trainNumber + "</h3>";
        teksti += "<p>Lähtöasema: " + data[i].trainType + " " + data[i].trainNumber + "</p>";
        teksti += "<p>Viimeisin päivitys: " + data[i].timestamp + "</p>";

        teksti += "<hr>";
    }

    document.getElementById("vastaus").innerHTML = teksti;
})
.catch(function(error) {
    document.getElementById("vastaus").innerHTML =
        "<p>Junadata ei latautunut</p>";
});
</script>

</body>
</html>

<main style="padding-left:16px">

    <h1>Sää</h1>
    <p>Haetaan Helsingin sää OpenWeather API:sta.</p>

    <div id="vastaus"></div>

</main>

<script>
fetch("https://api.openweathermap.org/data/2.5/weather?q=Helsinki&units=metric&appid=demo")
.then(function(response) {
    return response.json();
})
.then(function(data) {

    let teksti = "";

    teksti += "<h2>" + data.name + "</h2>";
    teksti += "<p>Lämpötila: " + data.main.temp + " °C</p>";
    teksti += "<p>Sää: " + data.weather[0].description + "</p>";
    teksti += "<p>Tuuli: " + data.wind.speed + " m/s</p>";

    document.getElementById("vastaus").innerHTML = teksti;
})
.catch(function(error) {
    document.getElementById("vastaus").innerHTML =
        "<p>Sään haku epäonnistui</p>";
});
</script>

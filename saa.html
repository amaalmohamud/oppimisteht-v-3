<main style="padding-left:16px">

    <h1>Sää</h1>
    <p>Haetaan Helsingin sää OpenWeather API:sta.</p>

    <div id="vastaus"></div>

</main>

<script>
fetch("https://api.open-meteo.com/v1/forecast?latitude=60.17&longitude=24.94&current_weather=true")
.then(function(response) {
    return response.json();
})
.then(function(data) {

    let w = data.current_weather;

    let teksti =
        "<h2>Helsinki</h2>" +
        "<p>Lämpötila: " + w.temperature + " °C</p>" +
        "<p>Tuuli: " + w.windspeed + " m/s</p>" +
        "<p>Aika: " + w.time + "</p>";

    document.getElementById("vastaus").innerHTML = teksti;
})
.catch(function(error) {
    document.getElementById("vastaus").innerHTML =
        "<p>Sään haku epäonnistui</p>";
});
</script>

</body>

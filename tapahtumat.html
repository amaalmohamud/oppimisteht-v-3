<main style="padding-left:16px">

    <h1>Tampereen tapahtumat</h1>
    <p>Haetaan tapahtumat API:sta.</p>

    <div id="vastaus"></div>

</main>

<script>
fetch("https://open-api.myhelsinki.fi/v1/events/")
.then(function(data) {

    let teksti = "";

    for (let i = 0; i < 5; i++) {

        teksti += "<h3>" + data.data[i].name.fi + "</h3>";
        teksti += "<p>" + data.data[i].info.long_description + "</p>";
        teksti += "<hr>";
    }

    document.getElementById("vastaus").innerHTML = teksti;
})
.catch(function(error) {
    document.getElementById("vastaus").innerHTML =
        "<p>Virhe datan haussa</p>";
});
</script>

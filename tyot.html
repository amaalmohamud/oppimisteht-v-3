<!DOCTYPE html>
<html lang="fi">

<head>
    <title>Oppimistehtävä 3a</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Font Awesome hamburger iconia varten -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Oma CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="topnav" id="myTopnav">
        <a href="index.html">Etusivu</a>
        <a href="digicafe.html">Digi Cafe</a>
        <a href="palaveri.html">Palaveri</a>
        <a href="tapahtumat.html">Tapahtumat</a>
        <a href="saa.html">Sää</a>
        <a href="liikennekamera.html">Kamerat</a>
        <a href="junat.html">Junat</a>
        <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            <i class="fa fa-bars"></i>
        </a>
    </div>

    <main>
        <h1>Työpaikat</h1>
        <p>Tällä sivulla harjoitellaan JSON-datan hakemista ja käsittelyä fetch-apilla.</p>
    
        <div id="vastaus"></div>
    </main>

    <script>
        function myFunction() {
            var x = document.getElementById("myTopnav");
    
            if (x.className === "topnav") {
                x.className += " responsive";
            } else {
                x.className = "topnav";
            }
        }
    
        fetch('https://jaakkola.github.io/json/digitekniikat.json')
            .then(function (response) {
                return response.json();
            })
            .then(function (responseJson) {
                kerro(responseJson);
            })
            .catch(function (error) {
                document.getElementById("vastaus").innerHTML =
                    "<p>Tietoa ei pystytä hakemaan</p>";
            });
    
        function kerro(data) {
            var teksti = "";
    
            teksti = "<h1>" + data.otsikko + "</h1>";
            teksti = teksti + "<p>" + data.kuvaus + "</p>";
            teksti = teksti + "<p><img src='" + data.kuva + "' alt='kuva'></p>";
    
            document.getElementById("vastaus").innerHTML = teksti;
        }
    </script>
</body>

</html>

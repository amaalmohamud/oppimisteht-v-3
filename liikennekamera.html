<main style="padding-left:16px">

    <h1>Liikennekamerat</h1>
    <p>Haetaan liikennekameran kuva API:sta.</p>

    <div id="vastaus"></div>

</main>

<script>
fetch("https://tie.digitraffic.fi/api/v1/metadata/camera-stations")
.then(function(response) {
    return response.json();
})
.then(function(data) {

    let teksti = "";

    // otetaan ensimmäinen kamera esimerkkinä
    let asema = data.features[0];

    teksti += "<h2>" + asema.properties.names.fi + "</h2>";
    teksti += "<p>Sijainti: " + asema.geometry.coordinates + "</p>";

    document.getElementById("vastaus").innerHTML = teksti;
})
.catch(function(error) {
    document.getElementById("vastaus").innerHTML =
        "<p>Kameradata ei latautunut</p>";
});
</script>

</body>
</html>

<main style="padding-left:16px">

    <h1>Liikennekamerat</h1>
    <p>Haetaan liikennekameran kuva API:sta.</p>

    <div id="vastaus"></div>

</main>

<script>
fetch("https://tie.digitraffic.fi/api/weathercam/v1/stations")
.then(function(response) {
    return response.json();
})
.then(function(data) {

    let teksti = "";

    for (let i = 0; i < 5; i++) {

        teksti += "<h3>" + data.features[i].properties.name + "</h3>";
        teksti += "<p>ID: " + data.features[i].id + "</p>";
        teksti += "<hr>";
    }

    document.getElementById("vastaus").innerHTML = teksti;
});
</script>

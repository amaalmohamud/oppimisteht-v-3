<!DOCTYPE html>
<html lang="fi">

<head>
    <title>Digi Cafe</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAV -->
    <div class="topnav" id="myTopnav">
        <a href="index.html">Etusivu</a>
        <a href="digicafe.html" class="active">Digi Cafe</a>
        <a href="palaveri.html">Palaveri</a>
        <a href="tyot.html">Työpaikat</a>
        <a href="tapahtumat.html">Tapahtumat</a>
        <a href="saa.html">Sää</a>
        <a href="liikennekamera.html">Kamerat</a>
        <a href="junat.html">Junat</a>

        <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            <i class="fa fa-bars"></i>
        </a>
    </div>

  
    <div style="padding-left:16px">
        <h1>Digi Cafe</h1>
        <p>Tällä sivulla haetaan JSON-muotoista tietoa fetch-apilla.</p>

        <div id="vastaus"></div>
    </div>

  
    <script>
        function myFunction() {
            var x = document.getElementById("myTopnav");

            if (x.className === "topnav") {
                x.className += " responsive";
            } else {
                x.className = "topnav";
            }
        }

        fetch('https://jaakkola.github.io/json/digitekniikat.json')
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {

                let teksti = "";

                // otsikko ja kuvaus
                teksti += "<h2>" + data.otsikko + "</h2>";
                teksti += "<p>" + data.kuvaus + "</p>";

                // kuva
                teksti += "<p><img src='" + data.kuva + "' alt='kuva'></p>";

                // opintojakso
                teksti += "<h3>Opintojakso: " + data.opintojakso.nimi + "</h3>";
                teksti += "<p>Tunnus: " + data.opintojakso.tunnus + "</p>";
                teksti += "<p>Opintopisteet: " + data.opintojakso.opintopisteet + "</p>";

                // sisältö
                teksti += "<h3>Sisältö</h3><ul>";
                for (let i = 0; i < data.sisalto.length; i++) {
                    teksti += "<li>" + data.sisalto[i] + "</li>";
                }
                teksti += "</ul>";

                // tekniikat
                teksti += "<h3>Tekniikat</h3><ul>";
                for (let j = 0; j < data.tekniikat.length; j++) {
                    teksti += "<li><a href='" + data.tekniikat[j].linkki + "' target='_blank'>"
                        + data.tekniikat[j].aihe + "</a></li>";
                }
                teksti += "</ul>";

                document.getElementById("vastaus").innerHTML = teksti;
            })

            .catch(function (error) {
                document.getElementById("vastaus").innerHTML =
                    "<p>Tietoa ei pystytä hakemaan</p>";
            });
    </script>

</body>

</html>
